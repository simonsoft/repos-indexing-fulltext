# Solr is opt-in in the extension. These tests use Solr Dev Services.
quarkus.solr.enabled=true
quarkus.solr.devservices.cores.repositem.config-path=se/repos/indexing/solr/repositem

# Public repository identity required by the upgraded backend.
cms.hostname=cmshostname

# The Solr extension provides the named client. Fulltext indexing does not reserve item names.
quarkus.arc.exclude-types=\
  se.repos.indexing.config.RepositemSolrClientProducer,\
  se.simonsoft.cms.item.naming.CmsItemNameFactory
